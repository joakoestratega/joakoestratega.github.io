<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Informe de WhatsApp | Joako Estratega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--negro:#0F0F14;--amarillo:#F8B400;--blanco:#FFFFFF;--azul:#21209C;--fondo:#f3f2ee;--linea:#e4e2dc;--texto:#1b1b22;--suave:rgba(15,15,20,.6);--wa:#e7f6dc;--wafondo:#efe7dd;--rojo:#c0392b;--verde:#1e8449}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Montserrat',Arial,sans-serif;font-size:15px;line-height:1.55}
.w{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--negro);color:var(--blanco);padding:56px 0 48px}
.tag{color:var(--amarillo);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(28px,5vw,46px);line-height:1.08;margin:12px 0 14px;font-weight:900;max-width:820px}
h1 em{font-style:normal;color:var(--amarillo)}
header p{color:rgba(255,255,255,.75);max-width:700px;margin:0;font-size:16px}
.antes-despues{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px;max-width:760px}
.ad{border-radius:14px;padding:18px}
.ad.hoy{background:#1d1d24;border:1px solid #33333d}
.ad.meta{background:var(--amarillo);color:var(--negro)}
.ad small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ad b{display:block;font-size:34px;font-weight:900;line-height:1.1;margin:6px 0 4px}
.ad span{font-size:13px}
main{padding:34px 0 70px}
.bloque{background:var(--blanco);border-radius:18px;padding:30px 26px;margin-bottom:24px}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:900;margin:0 0 6px;line-height:1.15}
h2 small{display:block;color:var(--suave);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.intro{color:var(--suave);margin:0 0 22px;max-width:760px}
/* reglas */
.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.regla{border:2px solid var(--negro);border-radius:14px;padding:16px}
.regla b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--amarillo);align-items:center;justify-content:center;font-weight:900;margin-bottom:8px}
.regla p{margin:0;font-weight:600}
.regla span{display:block;font-weight:400;font-size:13px;color:var(--suave);margin-top:6px}
/* mapa */
.mapa{display:flex;flex-direction:column;align-items:center;gap:0}
.nodo{background:var(--negro);color:var(--blanco);border-radius:12px;padding:12px 18px;font-weight:700;text-align:center;max-width:520px;width:100%}
.nodo small{display:block;color:var(--amarillo);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.nodo.am{background:var(--amarillo);color:var(--negro)}
.nodo.am small{color:var(--negro);opacity:.7}
.flecha{width:2px;height:22px;background:var(--negro);position:relative}
.flecha::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--negro)}
.ramas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:820px}
.rama{border:2px dashed var(--negro);border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:600}
.rama i{display:block;font-style:normal;font-size:11px;color:var(--suave);font-weight:500;margin-top:2px}
/* pasos con celular */
.paso{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start;padding:26px 0;border-top:1px solid var(--linea)}
.paso:first-of-type{border-top:0;padding-top:4px}
.num{display:inline-block;background:var(--negro);color:var(--amarillo);font-weight:900;border-radius:8px;padding:2px 10px;font-size:13px;margin-bottom:8px}
.paso h3{margin:0 0 8px;font-size:20px;font-weight:800}
.paso p{margin:0 0 10px}
.porque{background:var(--fondo);border-radius:10px;padding:10px 12px;font-size:13px}
.porque b{color:var(--negro)}
.cel{background:var(--wafondo);border:8px solid var(--negro);border-radius:28px;padding:14px 10px;min-height:120px}
.burb{background:var(--blanco);border-radius:10px 10px 10px 2px;padding:8px 10px;font-size:13.5px;margin:0 22px 8px 0;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-line}
.burb.ella{background:var(--wa);border-radius:10px 10px 2px 10px;margin:0 0 8px 22px}
.burb .bot{display:block;border-top:1px solid #e6e6e6;margin:8px -10px -8px;padding:7px;text-align:center;color:#0a7cff;font-weight:600}
.burb .bot+.bot{margin-top:0}
.audio{display:flex;align-items:center;gap:8px;background:var(--blanco);border-radius:10px 10px 10px 2px;padding:9px 10px;margin:0 22px 8px 0;font-size:12px;color:var(--suave)}
.audio .play{width:26px;height:26px;border-radius:50%;background:var(--negro);position:relative;flex:none}
.audio .play::after{content:"";position:absolute;left:10px;top:7px;border:6px solid transparent;border-left:9px solid var(--amarillo)}
.audio .onda{flex:1;height:18px;background:repeating-linear-gradient(90deg,#9a9a9a 0 2px,transparent 2px 5px);opacity:.6;border-radius:2px}
.fotos{display:flex;gap:6px;margin:0 22px 8px 0}
.fotos div{flex:1;height:64px;border-radius:8px;background:#d9d3c8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b6457;text-align:center}
.falta{background:var(--amarillo);color:var(--negro);font-weight:800;border-radius:4px;padding:0 4px}
/* guiones */
.guiones{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.guion{border:1px solid var(--linea);border-radius:14px;padding:16px;background:#fcfbf8}
.guion h4{margin:0 0 4px;font-size:15px}
.guion .cuando{font-size:12px;color:var(--suave);margin-bottom:10px;display:block}
.guion blockquote{margin:0;border-left:4px solid var(--amarillo);padding:2px 0 2px 12px;font-size:14px}
/* recuperacion */
.linea-tiempo{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.toque{border-radius:14px;padding:16px;background:var(--negro);color:var(--blanco)}
.toque small{color:var(--amarillo);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.toque h4{margin:6px 0 8px;font-size:16px}
.toque p{margin:0;font-size:13.5px;color:rgba(255,255,255,.85);white-space:pre-line}
/* fragmentos */
.frag{border:1px solid var(--linea);border-radius:12px;margin-bottom:10px;overflow:hidden}
.frag-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--fondo);padding:10px 14px}
.frag-cab b{font-size:14px}
.frag-cab code{font-family:inherit;font-size:12px;color:var(--suave);font-weight:600}
.frag-txt{padding:12px 14px;white-space:pre-line;font-size:14px}
button.copiar{background:var(--negro);color:var(--amarillo);border:0;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;flex:none}
button.copiar.ok{background:var(--verde);color:var(--blanco)}
/* decisiones */
.decis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.decision{border:2px solid var(--amarillo);border-radius:14px;padding:16px;background:#fffaf0}
.decision h4{margin:0 0 6px}
.decision p{margin:0;font-size:13.5px}
.medir{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.medir th{background:var(--negro);color:var(--blanco);text-align:left;padding:10px 12px;font-size:13px}
.medir td{padding:10px 12px;border-bottom:1px solid var(--linea)}
.tabla{overflow-x:auto}
.indice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:24px}
.indice a{display:flex;gap:10px;align-items:center;background:var(--blanco);border-radius:12px;padding:12px 14px;color:var(--negro);text-decoration:none;font-weight:700;font-size:14px}
.indice a b{background:var(--amarillo);border-radius:6px;padding:0 8px}
.paso-extra{border-top:1px solid var(--linea);padding:4px 0 26px}
.paso-extra .intro{margin-bottom:14px}
.anexo .anx-sec{border-top:1px solid var(--linea);padding:22px 0 6px}
.anexo h2 .num,.anexo .anx-sec h2 .num{display:inline-block;background:var(--amarillo);color:var(--negro);border-radius:6px;padding:0 9px;margin-right:8px;font-size:15px}
.anexo .anx-sec h2{font-size:20px}
.anexo h3{font-size:16px;margin:18px 0 8px}
.anexo .sub{color:var(--suave);margin:0 0 14px}
.anexo .anexo .cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.anexo .cifra{background:var(--negro);color:var(--blanco);border-radius:12px;padding:14px}
.anexo .cifra b{display:block;font-size:26px;color:var(--amarillo);line-height:1.1}
.anexo .cifra span{font-size:13px;color:rgba(255,255,255,.75)}
.anexo .tabla table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.anexo .tabla th{background:var(--negro);color:var(--blanco);text-align:left;padding:9px 11px;font-size:13px}
.anexo .tabla td{padding:9px 11px;border-bottom:1px solid var(--linea);vertical-align:top}
.anexo td.n{text-align:right;white-space:nowrap}
.anexo .malo{color:var(--rojo);font-weight:700}.anexo .bueno{color:var(--verde);font-weight:700}
.anexo .cita{font-style:italic;color:#3a3a46}
.anexo .alerta{border-left:5px solid var(--amarillo);background:#fff9e6;padding:12px 14px;border-radius:8px;margin:12px 0}
.anexo .alerta.roja{border-color:var(--rojo);background:#fdf0ee}
.anexo .nota{font-size:13px;color:var(--suave)}
.anexo ol.pasos{counter-reset:p;list-style:none;padding:0}
.anexo ol.pasos li{counter-increment:p;position:relative;padding:10px 12px 10px 50px;border:1px solid var(--linea);border-radius:10px;margin-bottom:8px}
.anexo ol.pasos li::before{content:counter(p);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--amarillo);font-weight:800;display:flex;align-items:center;justify-content:center}
.anexo .chip{display:inline-block;background:var(--azul);color:var(--blanco);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px}
.medir td{white-space:pre-line}

.cifras3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:6px 0 26px}
.c3{background:var(--negro);color:var(--blanco);border-radius:16px;padding:18px}
.c3 b{display:block;color:var(--amarillo);font-size:34px;font-weight:900;line-height:1.05;margin-bottom:8px}
.c3 p{margin:0;font-size:14.5px;color:rgba(255,255,255,.88)}
.graf{border:1px solid var(--linea);border-radius:16px;padding:18px;margin:0 0 18px}
.graf h3{margin:0 0 4px;font-size:18px}
.graf .pie{color:var(--suave);font-size:13.5px;margin:10px 0 0}
.bh{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:10px;align-items:center;margin:9px 0}
.bh-et{font-size:13.5px}
.bh-pista{background:#efeee9;border-radius:4px;height:16px;overflow:hidden}
.bh-barra{display:block;height:100%;border-radius:0 4px 4px 0}
.bh-val{font-size:13.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bh-val small{font-weight:500;color:var(--suave)}
.columnas{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:230px;margin-top:14px}
.bv{display:flex;flex-direction:column;align-items:center;height:100%}
.bv-val{font-weight:800;font-size:14px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.bv-pista{flex:1;width:100%;max-width:56px;display:flex;align-items:flex-end}
.bv-barra{display:block;width:100%;background:var(--negro);border-radius:4px 4px 0 0}
.bv:last-child .bv-barra{background:var(--rojo)}
.bv-mes{font-weight:700;font-size:13px;margin-top:6px}
.bv-n{font-size:11px;color:var(--suave);text-align:center}
.hacer{margin:0;padding-left:22px}
.hacer li{margin-bottom:8px}
@media (max-width:560px){.bh{grid-template-columns:1fr auto}.bh-et{grid-column:1 / -1}.columnas{gap:4px}.bv-n{font-size:9.5px}}
footer{text-align:center;color:var(--suave);font-size:13px;padding:0 16px 40px}
@media (max-width:820px){.paso{grid-template-columns:1fr}.cel{max-width:360px}}
@media (max-width:560px){.antes-despues{grid-template-columns:1fr}.ramas{grid-template-columns:1fr}.bloque{padding:24px 16px}}
@media print{
@page{size:A4;margin:12mm}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
button.copiar{display:none!important}
.paso,.frag,.cel,.decision,.graf,.toque,.nodo,tr,.porque{break-inside:avoid;page-break-inside:avoid}
h2,h3,h4{break-after:avoid;page-break-after:avoid}
}
.volver{display:inline-block;margin-top:18px;background:var(--negro);color:var(--amarillo);font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;text-decoration:none}

html{scroll-behavior:smooth}
:root{color-scheme:light}
h2[id]{scroll-margin-top:110px}
#menu{scroll-margin-top:20px}
.w{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--negro)}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--negro);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.barra .w{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.barra .w::-webkit-scrollbar{display:none}
.barra a{flex:0 0 auto;color:var(--blanco);text-decoration:none;font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px;background:#24242c;white-space:nowrap}
.barra a b{color:var(--amarillo);margin-right:6px}
.barra a.activo{background:var(--amarillo);color:var(--negro)}
.barra a.activo b{color:var(--negro)}
.barra a:focus-visible,.subir:focus-visible,.volver:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.subir{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--amarillo);color:var(--negro);font-weight:800;font-size:14px;padding:12px 16px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<style>.espera{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:700;color:var(--negro)}</style>
