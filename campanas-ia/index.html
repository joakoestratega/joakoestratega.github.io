<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prende tus campañas con IA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--crema:#FBF7EE;--crema2:#F3ECDC;--negro:#0F0F14;--amarillo:#F8B400;--amarillo2:#FFF3CF;--blanco:#fff;--texto:#2a2a33;--suave:#6b6b75;--verde:#1f9d55;--rojo:#d64545;--borde:#E6DDC8}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--crema);color:var(--texto);font-family:Montserrat,Arial,sans-serif;font-size:18px;line-height:1.55}
button{font-family:inherit}
/* barra de arriba */
.top{position:sticky;top:0;z-index:20;background:var(--crema);border-bottom:1px solid var(--borde)}
.top .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.marca{font-weight:800;font-size:15px;margin-right:auto;color:var(--negro)}
.marca span{background:var(--amarillo);padding:1px 6px;border-radius:4px}
.so{display:flex;background:var(--blanco);border:1px solid var(--borde);border-radius:999px;padding:3px}
.so button{background:none;border:0;color:var(--suave);font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer}
.so button.on{background:var(--negro);color:var(--blanco)}
.etapas{max-width:860px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px}
.etapas div{flex:1;height:8px;border-radius:9px;background:var(--crema2);position:relative}
.etapas div.hecha{background:var(--amarillo)}
.etapas div.actual{background:linear-gradient(90deg,var(--amarillo) var(--p,0%),var(--crema2) var(--p,0%))}
.nomEtapa{max-width:860px;margin:0 auto;padding:0 16px 10px;font-size:13px;font-weight:700;color:var(--suave);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* tarjeta del paso */
main{max-width:860px;margin:0 auto;padding:22px 16px 140px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:22px;padding:28px;box-shadow:0 6px 24px rgba(60,40,0,.06)}
.cuenta{font-size:14px;font-weight:700;color:var(--suave);margin-bottom:6px}
h1{font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0 0 10px;color:var(--negro);font-weight:800}
.que{font-size:19px;margin:0 0 4px}
.que b{background:var(--amarillo2);padding:0 4px;border-radius:4px}
ol.mini{margin:16px 0 0;padding-left:0;list-style:none;counter-reset:m}
ol.mini li{counter-increment:m;position:relative;padding:8px 0 8px 46px;font-size:18px}
ol.mini li::before{content:counter(m);position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;font-weight:800;font-size:15px}
kbd{display:inline-block;background:var(--blanco);border:1px solid #cfc6b2;border-bottom-width:3px;border-radius:6px;padding:0 8px;font:700 15px Montserrat;color:var(--negro);margin:0 2px}
/* acciones */
.copiar{display:flex;margin:16px 0 6px;border:2px solid var(--negro);border-radius:14px;overflow:hidden}
.copiar code{flex:1;min-width:0;padding:14px 16px;font:16px Consolas,Menlo,monospace;background:#fff;color:var(--negro);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.copiar button{border:0;background:var(--amarillo);color:var(--negro);font-weight:800;font-size:16px;padding:0 20px;cursor:pointer;min-width:120px}
.copiar button.ok{background:var(--verde);color:#fff}
.abrir{display:inline-flex;align-items:center;gap:10px;background:var(--negro);color:var(--blanco);text-decoration:none;font-weight:800;font-size:17px;padding:14px 22px;border-radius:14px;margin:14px 0 4px}
.abrir:hover{background:#2a2a33}
.ojo{background:var(--amarillo2);border-radius:12px;padding:12px 16px;margin:16px 0 0;font-size:16px}
.ojo b{color:var(--negro)}
/* dibujos */
.dib{margin:20px 0 4px;border-radius:16px;overflow:visible;border:1px solid #d9d0bc;background:#eef0f4;position:relative}
.dib .leyenda{border-radius:16px 16px 0 0;background:var(--crema2);font-size:13px;font-weight:700;color:var(--suave);padding:7px 12px}
.ventana{margin:16px 16px 40px;border-radius:10px;overflow:visible;box-shadow:0 6px 18px rgba(0,0,0,.18);background:#fff}
.ventana .barra{border-radius:10px 10px 0 0;background:#e9e9ee;padding:7px 10px;font-size:12px;color:#555;display:flex;gap:6px;align-items:center}
.ventana .barra i{width:10px;height:10px;border-radius:50%;background:#c9c9cf;display:inline-block}
.ventana .barra span{margin-left:8px;font-weight:600}
.ventana .barra.win{justify-content:space-between;background:#f3f3f3;border-radius:6px 6px 0 0;padding:6px 12px}
.ventana .barra.win span{margin-left:0}
.ventana .barra.win .ctl{font-weight:400;color:#333;letter-spacing:1px}
.menuvs{background:#1f1f1f;color:#ccc;font:12px 'Segoe UI',Montserrat;padding:4px 12px;border-bottom:1px solid #333}
.vs{display:flex;min-height:230px;background:#1f1f1f;border-radius:0 0 10px 10px;overflow:hidden;font:13px Consolas,Menlo,monospace}
.vs .exp{width:30%;background:#181818;color:#ccc;padding:10px;font:12px Montserrat}
.vs .exp b{display:block;color:#888;font-size:11px;margin-bottom:6px}
.vs .ed{flex:1;background:#1f1f1f}
.vs .panel{width:48%;background:#252526;border-left:1px solid #333;color:#e8e8e8;display:flex;flex-direction:column}
.vs .panel .cab{padding:7px 10px;border-bottom:1px solid #333;font:700 12px Montserrat;color:#f3f3f3}
.vs .panel .chat{flex:1;padding:10px;white-space:pre-wrap}
.vs .panel .caja{margin:8px;border:1px solid #555;border-radius:6px;padding:7px;color:#999}
.vs .v{color:#5fd38b}.vs .a{color:var(--amarillo)}.vs .g{color:#8a8a95}
.term{border-radius:0 0 10px 10px;background:#0c0c10;color:#e8e8e8;font:14px Consolas,Menlo,monospace;padding:14px;min-height:90px;white-space:pre-wrap}
.term .v{color:#5fd38b}.term .a{color:var(--amarillo)}.term .g{color:#8a8a95}
.web{padding:16px;font-size:14px;color:#333}
.web .bt{display:inline-block;background:#1877f2;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700;margin:4px 6px 4px 0}
.web .bt.gris{background:#e4e6eb;color:#222}
.web .campo{border:1px solid #ccd0d5;border-radius:6px;padding:8px 10px;margin:6px 0;background:#fff;color:#888}
.web .fila{display:flex;justify-content:space-between;align-items:center;border:1px solid #e0e0e0;border-radius:8px;padding:9px 12px;margin:6px 0;font:14px Consolas,monospace;background:#fff}
.chip{font:700 12px Montserrat;padding:4px 9px;border-radius:6px}
.chip.auth{background:#e3bf86;color:#222}.chip.ok{background:#4bbf73;color:#fff}
.aqui{position:relative;outline:4px solid var(--amarillo);outline-offset:3px;border-radius:8px;animation:pulso 1.4s infinite}
.aqui::after{content:"👆 Aquí";position:absolute;right:-6px;bottom:-34px;background:var(--negro);color:var(--amarillo);font:800 12px Montserrat;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:2}
@keyframes pulso{0%,100%{outline-color:var(--amarillo)}50%{outline-color:rgba(248,180,0,.35)}}
.inicio{display:flex;gap:16px;padding:16px;align-items:flex-end}
.menuWin{background:#f3f3f3;border-radius:10px;padding:12px;width:260px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:13px}
.menuWin .busca{background:#fff;border:2px solid #2b6fd6;border-radius:18px;padding:6px 12px;margin-bottom:10px;color:#222}
.menuWin .res{display:flex;gap:10px;align-items:center;background:#dfe6f3;border-radius:8px;padding:8px}
.icoPS{width:28px;height:28px;border-radius:6px;background:#012456;color:#fff;display:grid;place-items:center;font:700 13px Consolas}
.icoTerm{width:28px;height:28px;border-radius:6px;background:#222;color:#fff;display:grid;place-items:center;font:700 13px Consolas}
.teclas{font-size:14px;color:#333;padding:0 16px 16px}
/* ayuda */
.ayuda{margin-top:22px;border-top:2px dashed var(--borde);padding-top:14px}
.ayuda>button{background:none;border:0;color:var(--rojo);font-weight:800;font-size:16px;cursor:pointer;padding:6px 0}
.ayuda .caja{display:none;margin-top:8px}
.ayuda.abierta .caja{display:block}
.prob{background:#FFF7F5;border:1px solid #F3D3CC;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:16px}
.prob b{display:block;color:var(--rojo);margin-bottom:4px}
/* formulario */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;color:var(--negro)}
.form label small{font-weight:600;color:var(--suave)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{background:#fff;border:2px solid var(--borde);color:var(--negro);border-radius:12px;padding:12px;font:16px Montserrat}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--amarillo);outline:none}
.form textarea{min-height:70px;resize:vertical}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{background:#fff;border:2px solid var(--borde);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
.tabs button.on{border-color:var(--negro);background:var(--negro);color:#fff}
.lista{margin:14px 0 0;padding:0;list-style:none}
.lista li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--borde);font-size:17px}
.lista li:first-child{border-top:0}
.lista input{width:24px;height:24px;accent-color:var(--amarillo);flex:0 0 auto}
/* botonera fija */
.pie{position:fixed;left:0;right:0;bottom:0;background:rgba(251,247,238,.97);border-top:1px solid var(--borde);z-index:30}
.pie .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center}
.atras{background:#fff;border:2px solid var(--borde);color:var(--negro);border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer}
.sig{flex:1;background:var(--amarillo);border:0;color:var(--negro);border-radius:14px;padding:16px;font-weight:800;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #c98f00}
.sig:active{transform:translateY(2px);box-shadow:0 2px 0 #c98f00}
.indice{background:none;border:0;color:var(--suave);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline}
.mapa{display:none;position:fixed;inset:0;background:rgba(15,15,20,.45);z-index:40;padding:20px;overflow:auto}
.mapa.on{display:block}
.mapa .hoja{max-width:520px;margin:30px auto;background:#fff;border-radius:18px;padding:20px}
.mapa h3{margin:14px 0 6px;font-size:14px;color:var(--suave);text-transform:uppercase;letter-spacing:.5px}
.mapa a{display:block;padding:7px 10px;border-radius:8px;color:var(--negro);text-decoration:none;font-size:16px}
.mapa a:hover{background:var(--crema)}
.mapa a.hecho::before{content:"✓ ";color:var(--verde);font-weight:800}
.mapa a.aquiEs{background:var(--amarillo2);font-weight:800}
.final{text-align:center}
.final .grande{font-size:64px}
@media (max-width:640px){body{font-size:17px}.card{padding:20px}.form{grid-template-columns:1fr}.inicio{flex-direction:column;align-items:stretch}.menuWin{width:auto}.copiar{flex-direction:column}.copiar button{padding:12px}}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <div class="marca">Campañas con IA · <span>Joako Estratega</span></div>
    <div class="so"><button data-elige="win">Windows</button><button data-elige="mac">Mac</button></div>
  </div>
  <div class="etapas" id="etapas"></div>
  <div class="nomEtapa"><span id="nomEtapa"></span><button class="indice" id="verMapa">Ver todos los pasos</button></div>
</div>

<main><div class="card" id="card"></div></main>

<div class="pie"><div class="in">
  <button class="atras" id="atras">← Atrás</button>
  <button class="sig" id="sig">Ya lo hice →</button>
</div></div>

<div class="mapa" id="mapa"><div class="hoja" id="hojaMapa"></div></div>

<script>
var SO='win';
function W(win,mac){return SO==='mac'?mac:win}
var VENTANA=function(){return W('PowerShell','Terminal')};
var PEGAR=function(){return W('<kbd>Ctrl</kbd> + <kbd>V</kbd> (o clic derecho dentro de la ventanita)','<kbd>Cmd</kbd> + <kbd>V</kbd>')};

/* ---------- dibujos ---------- */
function dibAbrirVentana(){return '';}
function _viejo_dibAbrirVentana(){
  return SO==='mac'
  ? '<div class="dib"><div class="leyenda">Así se ve</div><div class="inicio"><div class="menuWin" style="border-radius:14px"><div class="busca">🔍 Terminal</div><div class="res aqui"><div class="icoTerm">&gt;_</div><b>Terminal</b></div></div></div><div class="teclas">Teclas: <kbd>Cmd</kbd> + <kbd>Espacio</kbd>, escribes <b>Terminal</b> y <kbd>Enter</kbd></div></div>'
  : '<div class="dib"><div class="leyenda">Así se ve</div><div class="inicio"><div class="menuWin"><div class="busca">🔍 PowerShell</div><div class="res aqui"><div class="icoPS">&gt;_</div><b>Windows PowerShell</b></div></div></div><div class="teclas">Tecla <kbd>⊞ Windows</kbd>, escribes <b>PowerShell</b> y das clic en el resultado</div></div>';
}
function barra(titulo,vs){
  if(SO==='mac') return '<div class="barra"><i></i><i></i><i></i><span>'+titulo+'</span></div>';
  return '<div class="barra win"><span>'+titulo+'</span><span class="ctl">─&nbsp;&nbsp;☐&nbsp;&nbsp;✕</span></div>'+
    (vs?'<div class="menuvs">Archivo&nbsp;&nbsp; Editar&nbsp;&nbsp; Selección&nbsp;&nbsp; Ver&nbsp;&nbsp; Ir&nbsp;&nbsp; Ejecutar&nbsp;&nbsp; Terminal&nbsp;&nbsp; Ayuda</div>':'');
}
function dibVS(chat,archivos){return '';}
function _viejo_dibVS(chat,archivos){return '<div class="dib"><div class="leyenda">Así se ve en VS Code</div><div class="ventana">'+barra('mis-anuncios - Visual Studio Code',true)+'<div class="vs"><div class="exp"><b>EXPLORADOR</b>📁 mis-anuncios<br>'+(archivos||'')+'</div><div class="ed"></div><div class="panel"><div class="cab">✻ Claude</div><div class="chat">'+chat+'</div><div class="caja">Escribe aquí…</div></div></div></div></div>'}
function dibTerm(texto,titulo){return '';}
function _viejo_dibTerm(texto,titulo){if(titulo==='Claude')return dibVS(texto);var fondo=SO==='win'?' style="background:#012456"':'';return '<div class="dib"><div class="leyenda">Así se ve</div><div class="ventana">'+barra(titulo||VENTANA())+'<div class="term"'+fondo+'>'+texto+'</div></div></div>'}
function dibWeb(url,html){return '';}
function _viejo_dibWeb(url,html){return '<div class="dib"><div class="leyenda">Así se ve</div><div class="ventana">'+barra('🔒 '+url)+'<div class="web">'+html+'</div></div></div>'}

/* ---------- pasos ---------- */
var URL_KIT='https://joakoestratega.com/campanas-ia';
var ETAPAS=['Prepárate','Instala','Pixel','Conecta Meta','Creativos','Campaña','Prender','Mejora'];
function skill(nombre,que){return '<p class="que">En el panel de Claude de VS Code, escribe esto y toca <kbd>Enter</kbd>:</p>'+copiar('/'+nombre)+(que||'')}
function respuesta(){
  var d=val('destino')==='whatsapp'?'whatsapp':'web';
  return d+', '+Number(val('ppto')).toLocaleString('es-CO')+' por conjunto, '+val('paises')+', marca '+val('marca')+
    (d==='web'?', link '+val('link'):'')+'. '+val('quien')+'. Ningún creativo está hecho con inteligencia artificial.';
}
var P=[
 {e:0,t:'Revisa que tengas todo',h:function(){return '<p class="que">Marca cada cosa que ya tienes. Si te falta algo, consíguelo primero.</p><ul class="lista">'+
  '<li><input type="checkbox"> Un computador con internet</li>'+
  '<li><input type="checkbox"> Una cuenta de <b>Claude</b> con plan Pro o Max <a href="https://claude.ai/upgrade" target="_blank">(ver planes)</a></li>'+
  '<li><input type="checkbox"> Tu <b>cuenta publicitaria</b> de Meta con tarjeta para pagar</li>'+
  '<li><input type="checkbox"> La <b>página de Facebook</b> de tu negocio</li>'+
  '<li><input type="checkbox"> Tu <b>tienda</b> (por ejemplo Shopify) con el link del producto</li>'+
  '<li><input type="checkbox"> Tus <b>creativos</b>: imágenes o videos de tus anuncios, ya terminados</li></ul>'}},

 {e:1,t:'Abre la ventanita de órdenes',h:function(){return '<p class="que">Es una ventana donde le escribes órdenes al computador. Se llama <b>'+VENTANA()+'</b>.</p><ol class="mini">'+
  W('<li>Toca la tecla <kbd>⊞ Windows</kbd> de tu teclado.</li><li>Escribe <b>PowerShell</b>.</li><li>Da clic en <b>Windows PowerShell</b>.</li>','<li>Toca <kbd>Cmd</kbd> + <kbd>Espacio</kbd> al mismo tiempo.</li><li>Escribe <b>Terminal</b>.</li><li>Toca <kbd>Enter</kbd>.</li>')+
  '</ol>'+dibAbrirVentana()},
  ayuda:function(){return [['No la encuentro',W('Da clic derecho en el botón de Windows (abajo a la izquierda) y escoge <b>Terminal</b> o <b>Windows PowerShell</b>.','Abre la carpeta <b>Aplicaciones</b> → <b>Utilidades</b> → <b>Terminal</b>.')]]}},

 {e:1,t:'Pega la orden que instala todo',h:function(){return '<p class="que">Con una sola orden se instala todo: Claude, VS Code (el programa donde vas a trabajar con Claude), las herramientas de campañas y la conexión con Meta.</p><ol class="mini"><li>Toca el botón amarillo <b>Copiar</b>.</li><li>Da clic dentro de la ventanita.</li><li>Pega con '+PEGAR()+'.</li><li>Toca <kbd>Enter</kbd> y espera unos minutos.</li></ol>'+
  copiar(W('irm '+URL_KIT+'/instalar.ps1 | iex','curl -fsSL '+URL_KIT+'/instalar.sh | bash'))+
  dibTerm('== Campañas con IA - Joako Estratega ==\n1/6 Git...\n2/6 Claude Code...\n3/6 VS Code...\n4/6 Claude dentro de VS Code...\n5/6 Herramientas de campañas...\n6/6 Conexión con Meta...\n\n<span class="v">LISTO.</span> Se creó la carpeta mis-anuncios en tu escritorio\ny se va a abrir VS Code en ella.')+
  '<div class="ojo">Tarda unos minutos. Sabes que terminó cuando dice <b>LISTO</b> y se abre VS Code solo. Ya puedes cerrar la ventanita.</div>'},
  ayuda:function(){return [
   ['Sale un error rojo que dice que los scripts están deshabilitados',SO==='win'?'Copia esto, pégalo, toca <kbd>Enter</kbd>, escribe <b>S</b> y toca <kbd>Enter</kbd>. Después vuelve a pegar la orden de instalar.'+copiar('Set-ExecutionPolicy -Scope CurrentUser RemoteSigned'):'Revisa que copiaste la orden completa y vuelve a pegarla.'],
   ['No pasa nada cuando pego','Da clic dentro de la ventanita antes de pegar. En Windows también puedes pegar con clic derecho.']]}},

 {e:1,t:'Abre Claude en VS Code e inicia sesión',h:function(){return '<p class="que">VS Code se abrió solo, con tu carpeta <b>mis-anuncios</b> a la izquierda. Aquí vas a trabajar el resto de la guía.</p><ol class="mini"><li>Si pregunta <b>¿Confías en los autores de esta carpeta?</b>, da clic en <b>Sí, confío</b>.</li><li>Arriba a la derecha da clic en el ícono de Claude <b>✻</b>. Se abre el panel de Claude.</li><li>Da clic en <b>Iniciar sesión</b>, escoge tu <b>cuenta de Claude (Pro o Max)</b> y autoriza en el navegador.</li><li>Vuelve a VS Code: el panel queda listo para escribir.</li></ol>'+
  dibVS('<span class="a">✻ Claude</span>\n\n<span class="g">¿En qué te ayudo hoy?</span>')+
  '<div class="ojo">De aquí en adelante, cuando la guía diga <b>escribe en Claude</b>, es en este panel: pegas y tocas <kbd>Enter</kbd>.</div>'},
  ayuda:[['No se abrió VS Code','Búscalo en tu computador como <b>Visual Studio Code</b>, ábrelo y entra a <b>Archivo → Abrir carpeta</b> → <b>Escritorio</b> → <b>mis-anuncios</b>.'],
         ['No veo el ícono de Claude ✻','Toca <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd> (en Mac <kbd>Cmd</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd>), busca <b>Claude Code</b>, instálalo y cierra y abre VS Code.'],
         ['Me pide pagar','Claude funciona con los planes Pro o Max. El plan gratis no sirve.']]},

 {e:2,t:'¿Ya tienes pixel?',h:function(){return '<p class="que">El pixel es un pedacito de código que le cuenta a Meta <b>quién compra</b> en tu tienda. Sin él, Meta no sabe a quién buscar.</p><div class="ojo"><b>Si ya tienes un pixel funcionando</b>, toca <b>Ver todos los pasos</b> arriba y salta a <b>Conecta Meta</b>. No crees otro.</div>'}},

 {e:2,t:'Abre el lugar donde viven los pixeles',h:function(){return '<ol class="mini"><li>Toca el botón negro.</li><li>Da clic en el botón azul <b>Conectar orígenes de datos</b>.</li></ol>'+

/* ---------- utilidades ---------- */
function guardar(k,v){try{localStorage.setItem('cm-'+k,v)}catch(e){}}
function leer(k){try{return localStorage.getItem('cm-'+k)}catch(e){return null}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function copiar(t){return '<div class="copiar"><code>'+esc(t)+'</code><button>Copiar</button></div>'}
function abrir(u,t){return '<a class="abrir" href="'+u+'" target="_blank">'+t+' ↗</a>'}
function campo(id,et,ph,tipo,ayuda){return '<label>'+et+(ayuda?' <small>'+ayuda+'</small>':'')+'<input id="f-'+id+'" placeholder="'+ph+'"'+(tipo?' type="'+tipo+'"':'')+'></label>'}
function val(id){var g=leer('f-'+id);var ph={destino:'web',link:'https://tutienda.com/faja',ppto:'20000',paises:'Colombia',marca:'FAJAS2026',quien:'Le vendo fajas a mujeres que quieren verse bien con su ropa sin que la faja se note'};return (g&&g.trim())||ph[id]}
function activarCopiar(){document.querySelectorAll('.copiar').forEach(function(c){var b=c.querySelector('button');b.onclick=function(){
  var t=c.querySelector('code').textContent;var ok=function(){b.textContent='¡Copiado! ✓';b.classList.add('ok');setTimeout(function(){b.textContent='Copiar';b.classList.remove('ok')},1800)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,viejo)}else viejo();
  function viejo(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()}}})}

/* ---------- pantalla ---------- */
var i=Math.min(Number(leer('paso')||0),P.length-1);
var hp=location.hash.match(/paso-(\d+)/);if(hp)i=Math.min(Number(hp[1])-1,P.length-1);
function pintar(){
  var p=P[i];var titulo=typeof p.t==='function'?p.t():p.t;
  var ay=typeof p.ayuda==='function'?p.ayuda():p.ayuda;
  var h='<div class="cuenta">Paso '+(i+1)+' de '+P.length+'</div><h1>'+titulo+'</h1>'+p.h();
  if(ay&&ay.length){h+='<div class="ayuda"><button>🙋 ¿No te salió igual? Toca aquí</button><div class="caja">'+ay.map(function(a){return '<div class="prob"><b>'+a[0]+'</b>'+a[1]+'</div>'}).join('')+'</div></div>'}
  var card=document.getElementById('card');card.innerHTML=h;
  var ab=card.querySelector('.ayuda>button');if(ab)ab.onclick=function(){ab.parentNode.classList.toggle('abierta')};
  if(p.despues)p.despues();
  // formulario
  card.querySelectorAll('[id^="f-"]').forEach(function(e){var k=e.id.slice(2);var g=leer('f-'+k);if(g)e.value=g;e.oninput=e.onchange=function(){guardar('f-'+k,e.value)}});
  activarCopiar();
  // barra de etapas
  var et=document.getElementById('etapas');et.innerHTML='';
  ETAPAS.forEach(function(n,k){var d=document.createElement('div');var enE=P.filter(function(x){return x.e===k});var pos=enE.indexOf(p);
    if(k<p.e||p.fin)d.className='hecha';else if(k===p.e){d.className='actual';d.style.setProperty('--p',((pos+1)/enE.length*100)+'%')}et.appendChild(d)});
  document.getElementById('nomEtapa').textContent='Parte '+(p.e+1)+' de '+ETAPAS.length+' · '+ETAPAS[p.e];
  document.getElementById('atras').style.visibility=i===0?'hidden':'visible';
  document.getElementById('sig').textContent=p.fin?'Volver a empezar ↺':(i===0?'Tengo todo, empecemos →':'Ya lo hice →');
  guardar('paso',i);window.scrollTo(0,0);
}
document.getElementById('sig').onclick=function(){var vis=JSON.parse(leer('hechos')||'[]');if(vis.indexOf(i)<0)vis.push(i);guardar('hechos',JSON.stringify(vis));i=P[i].fin?0:i+1;pintar()};
document.getElementById('atras').onclick=function(){if(i>0){i--;pintar()}};
function so(s){SO=s;document.querySelectorAll('[data-elige]').forEach(function(b){b.classList.toggle('on',b.dataset.elige===s)});guardar('so',s);pintar()}
document.querySelectorAll('[data-elige]').forEach(function(b){b.onclick=function(){so(b.dataset.elige)}});
// mapa de pasos
document.getElementById('verMapa').onclick=function(){
  var vis=JSON.parse(leer('hechos')||'[]');var h='<b style="font-size:18px">Todos los pasos</b>';
  ETAPAS.forEach(function(n,k){h+='<h3>'+(k+1)+'. '+n+'</h3>';P.forEach(function(p,j){if(p.e===k){var t=typeof p.t==='function'?p.t():p.t;h+='<a href="#" data-j="'+j+'" class="'+(vis.indexOf(j)>=0?'hecho ':'')+(j===i?'aquiEs':'')+'">'+t+'</a>'}})});
  h+='<button class="atras" style="margin-top:14px;width:100%" id="cerrarMapa">Cerrar</button>';
  var m=document.getElementById('mapa');document.getElementById('hojaMapa').innerHTML=h;m.classList.add('on');
  m.querySelectorAll('a[data-j]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();i=Number(a.dataset.j);m.classList.remove('on');pintar()}});
  document.getElementById('cerrarMapa').onclick=function(){m.classList.remove('on')};
};
document.getElementById('mapa').onclick=function(e){if(e.target.id==='mapa')this.classList.remove('on')};
so(leer('so')||(/Mac|iPhone|iPad/i.test(navigator.platform||navigator.userAgent)?'mac':'win'));
</script>
